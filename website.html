<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Manager</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #202124;
      color: white;
      padding: 18px 28px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .notice {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .extension {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 20px;
    }

    .name {
      font-weight: bold;
      font-size: 17px;
    }

    .id {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      background: #d93025;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #b3261e;
    }

    .status {
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>Extension Manager</header>

  <main class="container">
    <div class="notice">
      <strong>Administrator notice:</strong>
      Some extensions may be managed by your organization.
    </div>

    <div id="extensions"></div>

    <div class="status" id="status">
      3 extensions installed
    </div>
  </main>

  <script>
    const extensions = [
      { name: "Example Extension", id: "example-extension" },
      { name: "Study Tools", id: "study-tools" },
      { name: "School Helper", id: "school-helper" }
    ];

    const container = document.getElementById("extensions");
    const status = document.getElementById("status");

    function render() {
      container.innerHTML = "";

      extensions.forEach((ext, index) => {
        const card = document.createElement("div");
        card.className = "extension";

        card.innerHTML = `
          <div class="info">
            <div class="icon">E</div>
            <div>
              <div class="name">${ext.name}</div>
              <div class="id">ID: ${ext.id}</div>
            </div>
          </div>

          <button onclick="removeExtension(${index})">
            Remove
          </button>
        `;

        container.appendChild(card);
      });

      status.textContent =
        `${extensions.length} extension${extensions.length === 1 ? "" : "s"} installed`;
    }

    function removeExtension(index) {
      extensions.splice(index, 1);
      render();
    }

    render();
  </script>
</body>
</html>
