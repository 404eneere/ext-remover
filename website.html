<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Extension Toggler</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #202124;
      color: white;
      padding: 22px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h2 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .extension {
      background: white;
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 7px rgba(0,0,0,.08);
    }

    .extension-name {
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    /* Switch */
    .switch {
      position: relative;
      width: 52px;
      height: 29px;
      flex-shrink: 0;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 30px;
      cursor: pointer;
      transition: .2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 23px;
      height: 23px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: .2s;
    }

    input:checked + .slider {
      background: #5865f2;
    }

    input:checked + .slider::before {
      transform: translateX(23px);
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  School Extension Manager
</header>

<div class="container">

  <h2>Extensions</h2>
  <div class="subtitle">
    Demo interface — switches do not modify real browser extensions.
  </div>

  <div id="extensionList"></div>

  <div class="footer">
    Demo only
  </div>

</div>

<script>

const extensions = [
  {
    name: "Schoology",
    enabled: true
  },
  {
    name: "Google Classroom",
    enabled: true
  },
  {
    name: "GoGuardian",
    enabled: true
  },
  {
    name: "Lightspeed Filter",
    enabled: true
  },
  {
    name: "Securly",
    enabled: true
  },
  {
    name: "ClassLink",
    enabled: false
  },
  {
    name: "Grammarly",
    enabled: true
  },
  {
    name: "Google Translate",
    enabled: false
  }
];

function renderExtensions() {

  const list = document.getElementById("extensionList");

  list.innerHTML = "";

  extensions.forEach((extension, index) => {

    const item = document.createElement("div");

    item.className = "extension";

    item.innerHTML = `
      <div>
        <div class="extension-name">
          ${extension.name}
        </div>

        <div class="status">
          ${extension.enabled ? "Enabled" : "Disabled"}
        </div>
      </div>

      <label class="switch">

        <input
          type="checkbox"
          ${extension.enabled ? "checked" : ""}
          onchange="toggleExtension(${index}, this.checked)"
        >

        <span class="slider"></span>

      </label>
    `;

    list.appendChild(item);
  });
}

function toggleExtension(index, state) {

  extensions[index].enabled = state;

  renderExtensions();
}

renderExtensions();

</script>

</body>
</html>
