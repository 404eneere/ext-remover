<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Blocker Demo</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
  }

  .panel {
    width: 320px;
    padding: 24px;
    border-radius: 18px;
    background: #1f2937;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
  }

  .switch {
    position: relative;
    width: 56px;
    height: 30px;
  }

  .switch input {
    display: none;
  }

  .slider {
    position: absolute;
    inset: 0;
    background: #4b5563;
    border-radius: 30px;
    cursor: pointer;
    transition: .25s;
  }

  .slider::before {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    transition: .25s;
  }

  input:checked + .slider {
    background: #22c55e;
  }

  input:checked + .slider::before {
    transform: translateX(26px);
  }

  #status {
    margin-top: 18px;
    color: #9ca3af;
    font-size: 14px;
  }
</style>
</head>

<body>
  <div class="panel">
    <h2>School Blocker</h2>
    <p>Demo control panel</p>

    <div class="row">
      <span>Blocker</span>

      <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div id="status">Status: OFF</div>
  </div>

<script>
  const toggle = document.getElementById("toggle");
  const status = document.getElementById("status");

  toggle.addEventListener("change", () => {
    status.textContent =
      "Status: " + (toggle.checked ? "ON" : "OFF");

    // This is only a visual demo.
    // It does not change or bypass any school/network blocker.
  });
</script>
</body>
</html>
