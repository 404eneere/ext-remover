<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Check</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .card {
      width: min(520px, 90%);
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }

    h1 { margin-top: 0; }

    .status {
      padding: 14px;
      border-radius: 10px;
      background: #eef3ff;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #3867ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2854df;
    }

    #details {
      margin-top: 20px;
      font-size: 14px;
      color: #596579;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Access Check</h1>

    <div class="status" id="status">
      Checking your browser...
    </div>

    <button onclick="requestAccess()">
      Request Access
    </button>

    <div id="details"></div>
  </main>

  <script>
    function checkBrowser() {
      const checks = [];

      checks.push({
        name: "JavaScript",
        ok: true
      });

      checks.push({
        name: "Cookies",
        ok: navigator.cookieEnabled
      });

      checks.push({
        name: "Online connection",
        ok: navigator.onLine
      });

      const blocked = checks.filter(check => !check.ok);

      const status = document.getElementById("status");

      if (blocked.length === 0) {
        status.textContent =
          "No browser-level problems were detected.";
      } else {
        status.textContent =
          blocked.length + " browser feature(s) may be restricted.";
      }

      document.getElementById("details").innerHTML =
        checks.map(check =>
          `${check.ok ? "✅" : "⚠️"} ${check.name}`
        ).join("<br>");
    }

    function requestAccess() {
      const reason = prompt(
        "Enter a short reason for requesting access:"
      );

      if (!reason) return;

      const subject = encodeURIComponent("Website Access Request");
      const body = encodeURIComponent(
        "I would like to request access to a website.\n\n" +
        "Reason: " + reason
      );

      // Replace with your school's approved support email.
      window.location.href =
        `mailto:it@example.edu?subject=${subject}&body=${body}`;
    }

    checkBrowser();
  </script>

</body>
</html>
